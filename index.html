<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>제품전략·상품기획자 염종협 포트폴리오</title>
    <style>
        :root {
            --paper: #fbfaf7;
            --white: #fff;
            --ink: #17212d;
            --muted: #617080;
            --line: #e3e6e5;
            --accent: #285c67;
            --accent-soft: #edf5f4;
            --max: 900px
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 88px
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.76;
            letter-spacing: -.012em
        }

        button {
            font: inherit
        }

        a {
            color: inherit;
            text-decoration: none
        }

        p {
            margin: 0 0 16px
        }

        strong {
            font-weight: 750;
            color: var(--ink)
        }

        .container {
            max-width: var(--max);
            margin: auto;
            padding: 0 30px
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(251, 250, 247, .96);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(12px)
        }

        .topbar-inner {
            max-width: var(--max);
            margin: auto;
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px
        }

        .brand {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: -.03em;
            white-space: nowrap
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 28px
        }

        .nav {
            display: flex;
            gap: 20px
        }

        .nav a {
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap
        }

        .nav a:hover,
        .nav a:focus-visible {
            color: var(--accent)
        }

        .language {
            display: flex;
            gap: 11px;
            align-items: center;
            white-space: nowrap
        }

        .language button {
            border: 0;
            border-bottom: 2px solid transparent;
            padding: 4px 0 5px;
            background: none;
            color: #89939b;
            font-size: 12px;
            font-weight: 650;
            cursor: pointer
        }

        .language button.active {
            border-color: var(--accent);
            color: var(--ink)
        }

        .language button:focus-visible,
        .nav a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px
        }

        .hero {
            padding: 92px 0 82px;
            border-bottom: 1px solid var(--line)
        }

        .eyebrow,
        .kicker {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .12em;
            color: var(--accent);
            text-transform: uppercase
        }

        .hero h1 {
            margin: 20px 0 26px;
            font-size: clamp(36px, 5vw, 56px);
            line-height: 1.18;
            letter-spacing: -.065em;
            font-weight: 790
        }

        .hero .lead {
            font-size: 21px;
            line-height: 1.62;
            max-width: 720px;
            font-weight: 550
        }

        .hero .summary {
            font-size: 16px;
            line-height: 1.85;
            color: #485766;
            max-width: 740px;
            margin-top: 18px
        }

        .hero .summary strong {
            color: var(--accent)
        }

        .hero-meta {
            margin-top: 28px;
            font-size: 12px;
            color: var(--muted)
        }

        .section {
            padding: 78px 0;
            border-bottom: 1px solid var(--line)
        }

        .section-heading {
            margin-bottom: 34px
        }

        .section-heading h2 {
            margin: 8px 0 8px;
            font-size: 30px;
            line-height: 1.35;
            letter-spacing: -.045em
        }

        .section-heading .sub {
            color: var(--muted);
            font-size: 15px
        }

        .case-intro {
            padding: 30px 0 40px;
            border-bottom: 1px solid var(--line)
        }

        .case-intro h3 {
            font-size: clamp(26px, 4vw, 38px);
            line-height: 1.35;
            letter-spacing: -.045em;
            margin: 12px 0 12px
        }

        .case-intro .meta {
            font-size: 13px;
            color: var(--muted)
        }

        .thesis {
            margin: 24px 0 0;
            padding: 20px 23px;
            background: var(--accent-soft);
            border-left: 3px solid var(--accent);
            font-size: 17px;
            font-weight: 680;
            line-height: 1.65
        }

        .chapter {
            padding: 48px 0;
            border-bottom: 1px solid var(--line)
        }

        .chapter h3 {
            font-size: 26px;
            letter-spacing: -.04em;
            line-height: 1.35;
            margin: 12px 0 18px
        }

        .chapter>p {
            font-size: 16px;
            color: #3c4a58;
            line-height: 1.85;
            max-width: 780px
        }

        .question {
            margin: 26px 0 0;
            padding: 20px 24px;
            border-left: 3px solid var(--accent);
            background: #f4f7f5
        }

        .question .kicker {
            display: block;
            margin-bottom: 6px
        }

        .question blockquote {
            font-size: 19px;
            line-height: 1.6;
            font-weight: 700;
            margin: 0
        }

        .reason-list {
            margin-top: 25px;
            display: grid;
            gap: 0
        }

        .reason {
            display: grid;
            grid-template-columns: 44px 1fr;
            gap: 12px;
            padding: 17px 0;
            border-top: 1px solid var(--line)
        }

        .reason:last-child {
            border-bottom: 1px solid var(--line)
        }

        .reason .index {
            font-size: 13px;
            font-weight: 750;
            color: var(--accent)
        }

        .reason h4 {
            font-size: 17px;
            margin: 0 0 4px
        }

        .reason p {
            color: var(--muted);
            font-size: 14px;
            margin: 0
        }

        .stream {
            padding: 26px 0;
            border-top: 1px solid var(--line)
        }

        .stream:last-child {
            border-bottom: 1px solid var(--line)
        }

        .stream h4 {
            font-size: 20px;
            margin: 0 0 13px;
            letter-spacing: -.03em
        }

        .stream .detail {
            display: grid;
            grid-template-columns: 108px 1fr;
            gap: 14px;
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.75
        }

        .stream .detail dt {
            color: var(--accent);
            font-weight: 750
        }

        .stream .detail dd {
            margin: 0;
            color: #40505d
        }

        .stream .detail:last-child dd {
            font-weight: 650;
            color: #203942
        }

        .conclusion {
            background: #f0f6f3;
            padding: 32px 34px;
            border-radius: 5px;
            border-bottom: 0;
            margin-top: 42px
        }

        .conclusion h3 {
            margin: 10px 0 16px
        }

        .conclusion p {
            color: #30434b
        }

        .conclusion strong {
            color: #175b57
        }

        .deliver {
            margin-top: 24px;
            color: var(--muted);
            font-size: 13px
        }

        .deliver b {
            color: var(--ink)
        }

        .older {
            border-top: 1px solid var(--line);
            padding: 25px 0
        }

        .older h3 {
            margin: 0;
            font-size: 19px
        }

        .older .date {
            font-size: 12px;
            color: var(--muted);
            margin: 5px 0 10px
        }

        .older p {
            font-size: 14px;
            color: #495865
        }

        .older details {
            margin-top: 10px
        }

        .older summary {
            cursor: pointer;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700
        }

        .older ul {
            padding-left: 19px;
            font-size: 14px;
            color: #46535f
        }

        .older li {
            margin: 6px 0
        }

        .older h4 {
            font-size: 13px;
            margin: 15px 0 5px
        }

        .experience-total {
            margin: 0 0 24px;
            padding: 18px 22px;
            background: var(--accent-soft);
            border-left: 3px solid var(--accent)
        }

        .experience-total strong {
            display: block;
            font-size: 21px;
            line-height: 1.45;
            color: var(--ink)
        }

.career {
            border-top: 1px solid var(--line);
            padding: 20px 0;
            display: flex;
            justify-content: space-between;
            gap: 20px
        }

        .career h3 {
            font-size: 17px;
            margin: 0 0 6px
        }

        .career p {
            font-size: 13px;
            color: var(--muted);
            margin: 0
        }

        .career time {
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap
        }

        .approach-list {
            border-top: 1px solid var(--line);
        }
        .approach-item {
            display: grid;
            grid-template-columns: 185px minmax(0, 1fr);
            gap: 28px;
            padding: 23px 0;
            border-bottom: 1px solid var(--line);
        }
        .approach-item h3 {
            margin: 0;
            font-size: 17px;
            line-height: 1.5;
            letter-spacing: -.02em;
        }
        .approach-item p {
            margin: 0;
            color: #495865;
            font-size: 14px;
            line-height: 1.8;
        }
        .footer {
            padding: 32px 0 50px;
            font-size: 12px;
            color: var(--muted)
        }

        @media(max-width:700px) {
            .container {
                padding: 0 20px
            }

            .topbar-inner {
                padding: 13px 20px
            }

            .header-right {
                gap: 15px
            }

            .nav {
                display: none
            }

            .hero {
                padding: 68px 0 58px
            }

            .hero .lead {
                font-size: 18px
            }

            .section {
                padding: 58px 0
            }

            .section-heading h2 {
                font-size: 26px
            }

            .chapter {
                padding: 39px 0
            }

            .chapter h3 {
                font-size: 23px
            }

            .stream .detail {
                grid-template-columns: 1fr;
                gap: 0;
                margin: 14px 0
            }

            .stream .detail dt {
                margin-bottom: 2px
            }

            .conclusion {
                padding: 25px 22px
            }

            .approach-item {
                grid-template-columns: 1fr;
                gap: 6px;
                padding: 20px 0;
            }
            .career {
                display: block
            }

            .career time {
                display: block;
                margin-top: 8px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            html {
                scroll-behavior: auto
            }
        }
    </style>
</head>

<body>
    <div class="topbar">
        <div class="topbar-inner"><a class="brand" href="#top" id="brand">HOME</a>
            <div class="header-right">
                <nav class="nav" aria-label="Sections"><a href="#featured" data-nav></a><a href="#earlier"
                        data-nav></a><a href="#experience" data-nav></a><a href="#approach" data-nav></a></nav>
                <div class="language" role="group" aria-label="Language"><button type="button" data-lang="ko"
                        aria-label="한국어">KO</button><button type="button" data-lang="en"
                        aria-label="English">EN</button></div>
            </div>
        </div>
    </div>
    <main id="content" class="container"></main>
    <script>
        const DATA = {"ko":{"title":"제품전략·상품기획자","name":"염종협","intro":"기술과 사업을 함께 이해하고, 고객의 문제를 제품 전략으로 풀어내 다양한 조직과의 협업을 통해 실행으로 연결합니다.","hero":"기존 SaaS Service의 상품성을 개선하고, 운영 데이터와 현장 기능을 부가 서비스로 연결해 <strong>반복 매출의 기반이 되는 상품 로드맵<\/strong>을 수립했습니다.","nav":["대표 사례","이전 프로젝트","경력","일하는 방식"],"period":"2026.04 – 2026.12 · 개발 진행 중","case":"대표 사례","case_title":"SaaS를 HW의 Bundle 제품에서 지속적인 매출을 발생시킬 수 있는 상품으로","case_sub":"자사 SaaS 플랫폼 상품 전략 및 Value-added Service 로드맵","takeaway":"제가 수립한 것은 개별 기능의 목록이 아니라, 고객이 SaaS를 도입하고 계속 사용할 이유를 만드는 통합 상품 로드맵입니다.","problem_label":"01 / 문제 정의","problem_title":"HW만으로는 경쟁력이 떨어지는 상황에서 SW의 상품성도 부족했다","problem_text":"HW 중심으로 성장해 온 사업은 가격 경쟁이 심해질수록 납품만으로 고객 관계를 이어가기 어려웠습니다. SW가 그 역할을 해야 했지만, 기존 SaaS 제품은 개발자 관점에서 설계되어 사용성이 떨어졌고, IA도 부재해 필요한 기능을 찾고 사용하는 과정부터 어려웠습니다. 새로운 기능을 더하는 것만으로는 상품성이 생기지 않는 상태였습니다.","question_label":"핵심 질문","question":"“고객이 왜 우리 SaaS를 쓰기 시작하고, HW 납품 이후에도 왜 계속 써야 하는가?”","thought_label":"02 / 판단과 설계","thought_title":"기능을 추가하기 전에, 고객이 가치를 얻는 순서를 정했다","thought_intro":"문제를 UI 불편으로만 좁히지 않았습니다. 도입 장벽, SaaS 전환 이유, 납품 이후의 지속 이용 가치를 각각 분리해 보고, 이를 하나의 로드맵으로 연결했습니다.","thinking":[["01","먼저 쓸 수 있어야 한다","IA와 선반 모니터링 UX를 정비해 기존 SaaS의 탐색·운영 경험을 개선한다."],["02","전환할 이유가 있어야 한다","분산된 리테일 데이터를 Shelf 중심 Digital Twin과 AI 인사이트로 연결한다."],["03","납품 후에도 계속 쓸 이유가 있어야 한다","전자 가격표의 납품·사용·교체 이력을 관리하고, 매장 직원이 상품을 찾거나 주문 상품을 집어낼 때 쓸 수 있는 기능을 더한다."]],"execution_label":"03 / 해결 설계","execution_title":"전략을 실제 서비스와 개발 범위로 내렸다","problem":"어떤 문제였나","decision":"어떻게 풀었나","value":"고객이 얻는 가치","streams":[["SaaS 사용성 · 선반 모니터링 UX","기기·개발 관점의 메뉴 구조와 분절된 선반 분석 화면 때문에 업무 흐름을 따라가기 어려웠습니다.","사용자 업무 기준으로 IA와 Platform Core·별도 App의 경계를 재설계했습니다. Camera 상태·촬영·Shelf Image·ROG/OOS 결과를 하나의 흐름으로 연결하고, 상품·상태·위치 중심으로 결과를 재구성했습니다.","필요한 기능을 찾고 선반 상태를 이해하는 기본 경험을 개선합니다."],["AIR · Digital Twin과 AI Agent","ESL·Camera·Sensor·Signage 데이터가 흩어져 있어 선반 단위의 상태와 관계를 한눈에 볼 수 없었습니다.","Graph DB와 Ontology로 데이터를 연결하고, 매장 도면 기반 Virtual Map의 Shelf에 상품·기기·상태를 연계했습니다. 이 관계를 조회·분석하는 AI Agent 시나리오를 기획했습니다.","기존 On-premise 기능과 구별되는 SaaS 운영 인사이트를 제공합니다."],["전자 가격표(ESL) 연결 오류 방지 · 납품 후 이력 관리","전자 가격표(ESL)가 인접 매장의 무선 연결 장치(Gateway)에 잘못 연결되는 것을 막아야 했지만, 고객이 매장마다 박스를 스캔해 등록하는 방식은 부담이 컸습니다.","Company Whitelist를 고객사 단위 연결 허용 정책으로 설계했습니다. 출하 시 Box/MAC·Company Code 매핑과 변경·RMA 예외를 정의하고, 생산·납품·사용·재할당·RMA 이력을 서버에서 관리하는 서비스로 확장했습니다.","오연결과 등록 부담을 줄이고, 납품 이후 ESL 자산을 지속 관리할 기반을 만듭니다."],["Power Rail BLE · 현장 작업","상품 위치 찾기와 Picking에 위치 기반 상호작용이 필요했지만 상시 BLE Tracking은 전력·인프라 제약이 있었습니다.","작업 시점과 구역에서만 활성화하는 On-Demand Beaconing을 기획했습니다. 스마트폰·Power Rail·Gateway·ESL LED 간 동작을 정의해 상품 찾기, 근접 알림, Picking 흐름을 연결했습니다.","현장 작업자가 위치를 파악하고 스마트폰과 설비의 상호작용으로 탐색·Picking을 수행할 수 있습니다."]],"outcome_label":"04 / 결론","outcome_title":"SaaS 상품 로드맵을 수립하고, 제품화 과정을 매니징하고 있습니다.","outcome_text":"HW 납품만으로는 차별화하기 어렵고 기존 SaaS도 사용하기 힘들다는 문제에서 출발했습니다. 고객이 SaaS를 도입하고 계속 사용할 이유를 만들기 위해 사용성 개선, AIR, 전자 가격표의 납품·사용 이력 관리, 매장 내 상품 찾기와 Picking 기능을 <strong>하나의 Value-added Service 로드맵<\/strong>으로 수립했습니다. 사업·제품 방향을 보고하고, 법인·제품·개발 조직과 요구사항 및 우선순위를 조율했으며, IA·사용자 시나리오·데이터 관계·운영정책·개발 범위를 구체화해 개발을 팔로업하고 있습니다. 이를 통해 HW 고객의 SaaS 전환과 지속 이용을 바탕으로 SW 반복 매출을 만들 수 있는 상품화를 추진하고 있습니다. 2026년 말까지 개발 진행 중입니다.","deliver_label":"기획 범위","deliver":"상품 전략 및 로드맵 · IA · PRD · Prototype · 데이터 관계 · 운영정책 · System Flow · 개발 Hand-off","other_label":"이전 프로젝트","other_intro":"이전의 플랫폼·엔터프라이즈 구축 경험입니다.","career_label":"경력","career_intro":"제품 전략과 서비스 기획을 중심으로 일해 왔습니다.","results":"주요 결과","work":"수행 내용","footer":"제품 전략·상품기획 포트폴리오 · 2026.09","older":[{"title":"CubeX 클라우드 네이티브 PaaS 구축","period":"2024.04 ~ 2024.11","desc":"Kubernetes 기반 클라우드 네이티브 PaaS 플랫폼 구축 프로젝트로 고객 요구사항을 분석해 플랫폼 기능 구조와 Application Lifecycle을 기획하고 MVP 검증 및 개발 일정을 관리했습니다.","work":["고객 요구사항 분석 및 플랫폼 기능 구조 설계","One-Step Application 생성, Application Management, Auto Scaling 등 Application Lifecycle 기능 기획","PRD 및 Figma 기반 화면 설계와 기능 우선순위 정의","AI 디자인 도구를 활용한 MVP 핵심 기능 검증","개발팀 협업 및 구축 일정 관리"],"results":["AI 디자인 도구를 활용해 MVP 검증을 1개월 내 완료","핵심 기능 중심 개발 전략으로 일정 내 플랫폼 구축 완료","공공기관 플랫폼 구축으로 약 4억 원 규모 매출 기여"]},{"title":"현대엔지니어링 Q-Portal 구축","period":"2023.08 ~ 2024.02","desc":"건설 현장의 품질관리 업무를 통합 지원하는 포털 구축 프로젝트로 분리 운영되던 품질관리 시스템을 업무 프로세스 기준으로 통합하고 자재 승인 및 품질보고서 작성 과정을 개선했습니다.","work":["기존 품질관리 시스템 분석 및 업무 프로세스 기반 통합 기능구조 설계","자재 공급 승인 및 품질보고서 작성 프로세스 개선","프로젝트별 분산 체크리스트를 조직 단위로 재사용하는 Knowledge Data 구조 설계","품질시험 설정을 고정 3회에서 최대 6회까지 지원하도록 기능 확장","기능정의서 및 Figma 화면설계, 개발 협업, QA와 고객 요구사항 조율"],"results":["보고서 작성 건수 1,096건 → 515건, 약 53% 감소","결재 반려 건수 63건 → 6건, 약 90% 감소","현장 품질관리 업무 프로세스 단순화 및 데이터 재사용 구조 마련"]}],"careers":[{"name":"SOLUM","period":"2025.03 – 현재","roles":["Product Manager - Business & Product Strategy Group","Service Planner - CX Group"]},{"name":"㈜서원정보","period":"2023.06 – 2025.03 · 1년 10개월","roles":["서비스 기획"]}],"approach_title":"일하는 방식","approach_intro":"사업적 판단을 제품 요구사항으로 구체화하고, 기술과 조직 사이에서 실행을 연결합니다.","approach":[["제품 전략과 로드맵","시장·고객·해외 법인의 요구를 내부 기술 자산과 연결해 제품 방향과 우선순위를 정하고, 로드맵을 MRD·PRD와 개발 범위로 구체화합니다."],["기술을 이해하는 제품 기획","하드웨어·펌웨어부터 서버·API·웹·모바일까지 각 구성 요소의 역할과 데이터 흐름을 파악해, 기술 제약을 실제 구현 가능한 제품 요구사항으로 옮깁니다."],["운영정책과 예외 시나리오","정상적인 사용 흐름뿐 아니라 설치·재할당·물류·장애 상황까지 살펴보고, 현장에서 일관되게 운영할 수 있는 정책과 예외 처리 기준을 정리합니다."],["조직 간 조율과 실행 관리","사업·제품·UX·개발·영업·해외 법인·고객 사이에서 목표와 범위를 맞추고, 쟁점과 의사결정을 정리해 개발 진행을 팔로업합니다."],["온보딩과 멘토링","신규 입사자와 직무 전환 대상자가 제품 도메인과 업무 방식을 익힐 수 있도록 과제 배분, 산출물 리뷰, 업무 방향 설정을 지원합니다."]]},"en":{"title":"Product Strategy Portfolio","name":"Jonghyeob Yeom","intro":"I design reasons for customers to keep choosing software in a hardware-led business.","hero":"I improved the foundations of an existing SaaS product and connected operational data and store-floor workflows into <strong>a product roadmap designed for recurring software revenue.<\/strong>","nav":["Featured case","Earlier work","Experience","How I work"],"period":"Apr – Dec 2026 · Development in progress","case":"Featured case","case_title":"Turning SaaS from a set of features into a product customers keep using","case_sub":"SaaS product strategy and value-added service roadmap","takeaway":"I established an integrated product roadmap, not a list of features: a reason to adopt SaaS and a reason to keep using it.","problem_label":"01 / PROBLEM","problem_title":"As hardware competitiveness weakened, our software offering also lacked product appeal","problem_text":"As hardware price competition intensified, delivery alone could not sustain the customer relationship. Software needed to provide ongoing value, but the existing SaaS product was designed from a developer’s perspective, making it difficult to use, and lacked clear information architecture. Finding and using capabilities was difficult. Simply adding more features would not make it a stronger product.","question_label":"The question","question":"“Why would customers adopt our SaaS, and why would they keep using it after hardware delivery?”","thought_label":"02 / REASONING","thought_title":"I defined the sequence of value before adding features","thought_intro":"I did not treat this as a UI problem alone. I separated the barriers to adoption, the reason to move to SaaS, and the value customers would continue to receive after delivery, then connected them in one roadmap.","thinking":[["01","Make the product usable","Improve IA and shelf-monitoring UX so customers can navigate and operate the existing SaaS product."],["02","Give customers a reason to migrate","Connect retail data into shelf-centered digital twin and AI insights."],["03","Give customers a reason to keep using it after delivery","Track when electronic shelf labels are delivered, used, and replaced, and help store staff find products and pick items for orders."]],"execution_label":"03 / SOLUTION DESIGN","execution_title":"From product strategy to service and engineering scope","problem":"The problem","decision":"My approach","value":"Customer value","streams":[["SaaS usability · shelf-monitoring UX","Device- and engineering-led menus and fragmented shelf-analysis screens made it hard to follow an operational workflow.","I redesigned IA around user tasks and defined the boundary between platform core and standalone apps. I connected camera status, capture, shelf images, and ROG/OOS results into one journey, reframing results by product, status, and location.","Customers can navigate functions and interpret shelf conditions more easily."],["AIR · Digital Twin and AI Agent","ESL, camera, sensor, and signage data were fragmented, making shelf-level conditions and relationships hard to see.","I linked the data through a graph database and ontology, associated products, devices, and status with shelves on a retail-floor-plan virtual map, and planned AI agent scenarios for querying and analyzing these relationships.","SaaS provides operational insight beyond the existing on-premises feature set."],["Electronic shelf label connections · post-delivery history","Electronic shelf labels (ESLs) could connect to a gateway in an adjacent store, while asking customers to scan and register boxes for every store added operational work.","I designed Company Whitelist as a customer-level connection policy, including box/MAC-to-company mapping at shipment and reassignment and RMA exceptions. I extended the concept to server-side tracking of production, delivery, use, reassignment, and RMA events.","Prevent incorrect connections, reduce registration work, and create a basis for ongoing ESL asset management."],["Power Rail BLE · store-floor workflows","Product finding and picking needed location-aware interaction, while continuous BLE tracking faced power and infrastructure constraints.","I planned task- and area-triggered on-demand beaconing, defining interactions among smartphones, Power Rail, gateways, and ESL LEDs for product finding, proximity alerts, and picking.","Store staff can locate products and carry out picking through location-aware interactions with equipment."]],"outcome_label":"04 / CONCLUSION","outcome_title":"Established the SaaS product roadmap and am managing its productization","outcome_text":"I started with two connected problems: hardware delivery alone was hard to differentiate, and the existing SaaS product was difficult to use. To give customers reasons to adopt and keep using SaaS, I established <strong>one value-added service roadmap<\/strong> spanning usability improvements, AIR, electronic shelf label delivery and usage history, and in-store product finding and picking. I presented the product direction, aligned requirements and priorities with regional, product, and engineering teams, translated the strategy into IA, user scenarios, data relationships, operating policies, and development scope, and continue to follow up on development. The work is aimed at turning SaaS adoption and ongoing use by hardware customers into recurring software revenue. Development is in progress through the end of 2026.","deliver_label":"Planning scope","deliver":"Product strategy and roadmap · IA · PRD · prototype · data relationships · operating policies · system flows · engineering handoff","other_label":"Earlier work","other_intro":"Earlier platform and enterprise delivery experience.","career_label":"Experience","career_intro":"Product strategy and service planning across SaaS and enterprise platforms.","results":"Outcomes","work":"Responsibilities","footer":"Product Strategy Portfolio · Sep 2026","older":[{"title":"CubeX Cloud-native PaaS Implementation","period":"Apr 2024 – Nov 2024","desc":"Kubernetes-based cloud-native PaaS implementation in which customer requirements were translated into platform architecture and application lifecycle features, with responsibility for MVP validation and delivery scheduling.","work":["Analyzed customer requirements and designed the platform feature structure","Planned application lifecycle functions including one-step application creation, application management, and auto scaling","Defined UI specifications and feature priorities using PRDs and Figma","Validated core MVP functions using AI design tools","Coordinated with the engineering team and managed delivery schedules"],"results":["Completed MVP validation within one month using AI design tools","Completed platform delivery on schedule through a core-feature-focused strategy","Contributed to approximately KRW 400 million in revenue through a public-sector platform engagement"]},{"title":"Hyundai Engineering Q-Portal Implementation","period":"Aug 2023 – Feb 2024","desc":"Enterprise portal implementation supporting construction-site quality management. The project unified separately operated quality systems around business processes and improved material approval and quality-report workflows.","work":["Analyzed existing quality-management systems and designed an integrated feature structure around business processes","Improved material supply approval and quality-report workflows","Designed a knowledge-data structure to reuse project-specific checklists at the organizational level","Expanded quality-test settings from a fixed three rounds to up to six rounds","Produced functional specifications and Figma designs and coordinated engineering, QA, and customer requirements"],"results":["Reduced report creation volume from 1,096 to 515, approximately 53%","Reduced approval rejections from 63 to 6, approximately 90%","Simplified field quality-management processes and established a reusable data structure"]}],"careers":[{"name":"SOLUM","period":"Mar 2025 – Present","roles":["Product Manager - Business & Product Strategy Group","Service Planner - CX Group"]},{"name":"Seowon Information Co., Ltd.","period":"Jun 2023 – Mar 2025 · 1 yr 10 mos","roles":["Service Planner"]}],"approach_title":"How I work","approach_intro":"I turn business decisions into product requirements and connect technology, teams, and execution.","approach":[["Product strategy and roadmaps","I connect market, customer, and regional needs with internal technology assets, set product direction and priorities, and translate roadmaps into MRDs, PRDs, and development scope."],["Technically grounded product planning","I map component roles and data flows across hardware, firmware, servers, APIs, web, and mobile, then turn technical constraints into implementable product requirements."],["Operating policies and edge cases","I account for installation, reassignment, logistics, failures, and other exceptions alongside the main user flow, defining policies that support consistent operations."],["Cross-functional alignment and delivery","I align objectives and scope across business, product, UX, engineering, sales, regional teams, and customers, clarify decisions and open issues, and follow up on development."],["Onboarding and mentoring","I support new hires and colleagues transitioning into planning roles through task allocation, product-domain guidance, deliverable reviews, and direction-setting."]]}};
        const root = document.getElementById('content');
        const buttons = [...document.querySelectorAll('[data-lang]')];
        const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
        const e = escapeHtml;
        const dl = (label, text) => `<dl class="detail"><dt>${e(label)}</dt><dd>${e(text)}</dd></dl>`;
        const CAREER_START = {year: 2023, month: 6, day: 21};
        function experienceMonths(now = new Date()) {
            const parts = new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Seoul', year: 'numeric', month: 'numeric', day: 'numeric'}).formatToParts(now);
            const date = Object.fromEntries(parts.filter(p => ['year', 'month', 'day'].includes(p.type)).map(p => [p.type, Number(p.value)]));
            const months = (date.year - CAREER_START.year) * 12 + date.month - CAREER_START.month - (date.day < CAREER_START.day ? 1 : 0);
            return Math.max(0, months);
        }
        function experienceLabel(lang) {
            const months = experienceMonths(), years = Math.floor(months / 12), remainder = months % 12;
            if (lang === 'ko') return `총 경력 ${years}년 ${remainder}개월`;
            return `Total experience: ${years} ${years === 1 ? 'year' : 'years'} ${remainder} ${remainder === 1 ? 'month' : 'months'}`;
        }

        function render(lang) {
            const d = DATA[lang]; document.documentElement.lang = lang; document.title = d.title;
            document.getElementById('brand').textContent = d.name;
            document.querySelectorAll('[data-nav]').forEach((x, i) => x.textContent = d.nav[i]);
            buttons.forEach(b => {const on = b.dataset.lang === lang; b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on));});
            root.innerHTML = `
 <header class="hero" id="top"><span class="eyebrow">${e(d.name)} / Portfolio</span><h1>${e(d.title)}</h1><p class="lead">${e(d.intro)}</p><p class="summary">${d.hero}</p><p class="hero-meta">${e(d.period)}</p></header>
 <section class="section" id="featured"><div class="section-heading"><span class="kicker">01 / ${e(d.case)}</span><h2>${e(d.case_sub)}</h2></div>
 <div class="case-intro"><h3>${e(d.case_title)}</h3><p class="meta">${e(d.period)}</p><p class="thesis">${e(d.takeaway)}</p></div>
 <div class="chapter"><span class="kicker">${e(d.problem_label)}</span><h3>${e(d.problem_title)}</h3><p>${e(d.problem_text)}</p><div class="question"><span class="kicker">${e(d.question_label)}</span><blockquote>${e(d.question)}</blockquote></div></div>
 <div class="chapter"><span class="kicker">${e(d.thought_label)}</span><h3>${e(d.thought_title)}</h3><p>${e(d.thought_intro)}</p><div class="reason-list">${d.thinking.map(t => `<div class="reason"><span class="index">${e(t[0])}</span><div><h4>${e(t[1])}</h4><p>${e(t[2])}</p></div></div>`).join('')}</div></div>
 <div class="chapter"><span class="kicker">${e(d.execution_label)}</span><h3>${e(d.execution_title)}</h3>${d.streams.map(t => `<article class="stream"><h4>${e(t[0])}</h4>${dl(d.problem, t[1])}${dl(d.decision, t[2])}${dl(d.value, t[3])}</article>`).join('')}</div>
 <div class="chapter conclusion"><span class="kicker">${e(d.outcome_label)}</span><h3>${e(d.outcome_title)}</h3><p>${d.outcome_text}</p><p class="deliver"><b>${e(d.deliver_label)} · </b>${e(d.deliver)}</p></div></section>
 <section class="section" id="earlier"><div class="section-heading"><span class="kicker">02 / Archive</span><h2>${e(d.other_label)}</h2><p class="sub">${e(d.other_intro)}</p></div>${d.older.map(o => `<article class="older"><h3>${e(o.title)}</h3><p class="date">${e(o.period)}</p><p>${e(o.desc)}</p><details><summary>${e(d.work)} / ${e(d.results)}</summary><h4>${e(d.work)}</h4><ul>${o.work.map(x => `<li>${e(x)}</li>`).join('')}</ul><h4>${e(d.results)}</h4><ul>${o.results.map(x => `<li>${e(x)}</li>`).join('')}</ul></details></article>`).join('')}</section>
 <section class="section" id="experience"><div class="section-heading"><span class="kicker">03 / Career</span><h2>${e(d.career_label)}</h2><p class="sub">${e(d.career_intro)}</p></div><div class="experience-total"><strong>${e(experienceLabel(lang))}</strong></div>${d.careers.map(c => `<article class="career"><div><h3>${e(c.name)}</h3><p>${c.roles.map(e).join(' · ')}</p></div><time>${e(c.period)}</time></article>`).join('')}</section>
 <section class="section" id="approach"><div class="section-heading"><span class="kicker">04 / APPROACH</span><h2>${e(d.approach_title)}</h2><p class="sub">${e(d.approach_intro)}</p></div><div class="approach-list">${d.approach.map(item => `<article class="approach-item"><h3>${e(item[0])}</h3><p>${e(item[1])}</p></article>`).join('')}</div></section>
 <footer class="footer">${e(d.footer)}</footer>`;
            try {localStorage.setItem('portfolio_lang', lang)} catch (_) { }
        }
        buttons.forEach(b => b.addEventListener('click', () => render(b.dataset.lang)));
        let initial = 'ko'; try {initial = localStorage.getItem('portfolio_lang') === 'en' ? 'en' : 'ko'} catch (_) { } render(initial);
    </script>
</body>

</html>
